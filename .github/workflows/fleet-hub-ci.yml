name: Fleet Hub CI

# Ce dépôt étant un monorepo, GitHub Actions ne lit que .github/workflows à la
# racine — hubs/fleet-hub/.github/workflows/ci.yml (et son équivalent
# compliance-engine) n'ont jamais été exécutés depuis la fusion en monorepo.
# Ce fichier réactive la CI pour fleet-hub spécifiquement (filtrée par path
# pour ne pas se déclencher sur des changements compliance-engine).

on:
  push:
    branches: [main]
    paths: ['hubs/fleet-hub/**']
  pull_request:
    branches: [main]
    paths: ['hubs/fleet-hub/**']

concurrency:
  group: fleet-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hubs/fleet-hub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hubs/fleet-hub/backend/pom.xml
      - run: mvn -B test
      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-hub-backend-surefire-reports
          path: hubs/fleet-hub/backend/target/surefire-reports/
          retention-days: 7

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les tests « Backend (Maven) » tournent sur H2 avec un schéma généré par
    # Hibernate : ce job joue les vraies migrations Flyway sur PostgreSQL 16 (la
    # version de docker-compose.yml) puis valide le schéma (ddl-auto=validate),
    # comme au démarrage en production. Voir PostgresSchemaTest.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleethub_ci
          POSTGRES_USER: fleethub
          POSTGRES_PASSWORD: fleethub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fleethub -d fleethub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: hubs/fleet-hub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hubs/fleet-hub/backend/pom.xml
      - run: mvn -B test -Dtest=PostgresSchemaTest
        env:
          FLEETHUB_PG_URL: jdbc:postgresql://localhost:5432/fleethub_ci
          FLEETHUB_PG_USER: fleethub
          FLEETHUB_PG_PASSWORD: fleethub

  caddy:
    name: Reverse proxies (Caddy + nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Caddy (TLS, en-têtes de sécurité, CSP) et le nginx du frontend n'étaient vérifiés
    # qu'au déploiement : une erreur de syntaxe y coupait tout le site.
    steps:
      - uses: actions/checkout@v4
      - name: caddy validate
        run: >-
          docker run --rm -e DOMAIN=localhost
          -v "$PWD/hubs/fleet-hub/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: nginx -t
        # « backend » n'existe que dans le réseau docker compose : résolu ici vers 127.0.0.1.
        run: >-
          docker run --rm --add-host backend:127.0.0.1
          -v "$PWD/hubs/fleet-hub/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:alpine nginx -t

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hubs/fleet-hub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hubs/fleet-hub/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (tsc --noEmit, filet allowJs/checkJs)
        run: npm run typecheck
      - name: Format (prettier --check)
        run: npm run format:check
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    # Sans Redis, le backend démarre mais /actuator/health reste "DOWN"
    # (RedisReactiveHealthIndicator), donc le webServer de playwright.config.js
    # time out après 120s en attendant un serveur qui ne passera jamais "UP"
    # — reproduit et confirmé localement (redis-server standalone, pas besoin
    # de Docker) : avec Redis présent, /actuator/health passe à "UP" dans les
    # ~13s de démarrage habituels.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: hubs/fleet-hub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hubs/fleet-hub/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hubs/fleet-hub/frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        # --with-deps passe par apt : une panne des miroirs Ubuntu (vue le 11/11/2026, DNS
        # injoignable pendant l'installation de polices) faisait échouer le job avant tout
        # test. On réessaie une fois, puis on installe le navigateur seul : les
        # bibliothèques dont Chromium a besoin sont déjà sur l'image ubuntu-latest, et s'il
        # en manquait une, le lancement du navigateur échouerait avec un message explicite.
        run: |
          npx playwright install --with-deps chromium \
            || { sleep 30; npx playwright install --with-deps chromium; } \
            || npx playwright install chromium
      - name: Tests E2E
        run: npx playwright test
        env:
          CI: true
      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-hub-playwright-report
          path: hubs/fleet-hub/frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker build + scan Trivy
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, caddy, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build l'image backend
        run: docker build -t fleethub-backend:${{ github.sha }} hubs/fleet-hub/backend

      - name: Build l'image frontend
        run: docker build -t fleethub-frontend:${{ github.sha }} hubs/fleet-hub/frontend

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fleethub-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fleethub-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: fleet-hub-trivy-backend
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: fleet-hub-trivy-frontend
