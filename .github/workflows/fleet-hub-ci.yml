name: Fleet Hub CI

# Ce dépôt étant un monorepo, GitHub Actions ne lit que .github/workflows à la
# racine — hubs/fleet-hub/.github/workflows/ci.yml (et son équivalent
# compliance-engine) n'ont jamais été exécutés depuis la fusion en monorepo.
# Ce fichier réactive la CI pour fleet-hub spécifiquement (filtrée par path
# pour ne pas se déclencher sur des changements compliance-engine).

on:
  push:
    branches: [main]
    paths: ['hubs/fleet-hub/**']
  pull_request:
    branches: [main]
    paths: ['hubs/fleet-hub/**']

concurrency:
  group: fleet-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hubs/fleet-hub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hubs/fleet-hub/backend/pom.xml
      - run: mvn -B test
      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-hub-backend-surefire-reports
          path: hubs/fleet-hub/backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hubs/fleet-hub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hubs/fleet-hub/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Build
        run: npm run build
