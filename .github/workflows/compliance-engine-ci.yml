name: Compliance Engine CI

# Ce dépôt étant un monorepo, GitHub Actions ne lit que .github/workflows à la
# racine — hubs/compliance-engine/.github/workflows/ci.yml n'a jamais été
# exécuté depuis la fusion en monorepo (même constat et même fix que pour
# fleet-hub-ci.yml juste à côté). Ce fichier réactive la CI pour
# compliance-engine spécifiquement (filtrée par path pour ne pas se
# déclencher sur des changements fleet-hub).

on:
  push:
    branches: [main, master]
    paths: ['hubs/compliance-engine/**']
  pull_request:
    branches: [main, master]
    paths: ['hubs/compliance-engine/**']

concurrency:
  group: compliance-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hubs/compliance-engine/backend
    # JWT_SECRET est requis par CredentialEncryptionService (pas de valeur par
    # défaut sur ce placeholder précis) — sans lui, tout @SpringBootTest échoue
    # au démarrage du contexte. Valeur CI uniquement, jamais utilisée en prod
    # (voir SecurityPropertiesValidator qui rejette les secrets dev connus).
    env:
      JWT_SECRET: ci-only-test-jwt-secret-never-used-in-prod-32chars-min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hubs/compliance-engine/backend/pom.xml

      # Suite complete auto-suffisante (H2 en memoire, aucun service externe requis).
      - name: mvn test
        run: mvn -B test

      # Non lie a une phase du lifecycle (cf. pom.xml) donc jamais execute par
      # `mvn test` ci-dessus.
      - name: SpotBugs (analyse statique)
        run: mvn -B spotbugs:check

      - name: Publier le rapport SpotBugs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-engine-backend-spotbugs-report
          path: hubs/compliance-engine/backend/target/spotbugsXml.xml
          retention-days: 14

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-engine-backend-jacoco-report
          path: hubs/compliance-engine/backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hubs/compliance-engine/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hubs/compliance-engine/frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Typecheck + build
        run: npm run build

  mobile:
    name: Mobile (Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hubs/compliance-engine/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hubs/compliance-engine/mobile/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Typecheck + build
        run: npm run build
      # Valide la generation des projets natifs Android/iOS sans avoir besoin
      # d'un SDK Android ni de Xcode (aucun des deux n'est disponible en CI ici).
      - name: cap sync (validation des projets natifs)
        run: npx cap sync

  embeddings:
    name: Embeddings service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hubs/compliance-engine/embeddings-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hubs/compliance-engine/embeddings-service/requirements-dev.txt

      # requirements-dev.txt n'installe volontairement PAS sentence-transformers/torch
      # (voir tests/conftest.py) : ces tests unitaires valident la logique des
      # endpoints, pas le modèle ML — le job docker-embeddings ci-dessous couvre
      # le chargement du vrai modèle en construisant l'image complète.
      - run: pip install -r requirements-dev.txt
      - name: Tests unitaires (pytest)
        run: python -m pytest tests/ -v

  docker-backend:
    name: Docker build (backend)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: hubs/compliance-engine/backend
          push: false
          tags: incokalk-backend:ci

  docker-frontend:
    name: Docker build (frontend)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: hubs/compliance-engine/frontend
          push: false
          tags: incokalk-frontend:ci

  docker-embeddings:
    name: Docker build (embeddings-service)
    needs: embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Contrairement aux deux builds ci-dessus, celui-ci télécharge le vrai
      # modèle sentence-transformers pendant le build (voir Dockerfile) — c'est
      # la seule validation en CI que le modèle réel se charge correctement.
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: hubs/compliance-engine/embeddings-service
          push: false
          tags: incokalk-embeddings:ci
