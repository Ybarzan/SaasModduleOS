server:
  port: ${SERVER_PORT:8092}
  forward-headers-strategy: framework

spring:
  application:
    name: praxio-backend
  datasource:
    # ${random.uuid} : voir hubs/logistix/backend/application.yml, même raison
    # (cache de contexte Spring partagé entre classes de test).
    url: jdbc:h2:mem:praxio-${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

praxio:
  admin-password: "${ADMIN_PASSWORD:admin}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:*}"
  hubs:
    compliance-engine-url: "${COMPLIANCE_ENGINE_URL:http://localhost:8080}"
    compliance-engine-frontend-url: "${COMPLIANCE_ENGINE_FRONTEND_URL:http://localhost:5173}"
    fleet-hub-url: "${FLEET_HUB_URL:http://localhost:8090}"
    fleet-hub-frontend-url: "${FLEET_HUB_FRONTEND_URL:http://localhost:5199}"
    logistix-url: "${LOGISTIX_URL:http://localhost:8091}"
    logistix-frontend-url: "${LOGISTIX_FRONTEND_URL:http://localhost:5181}"

logging:
  level:
    com.praxio: "${APP_LOG_LEVEL:INFO}"

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:praxio}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:praxio}
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: false

praxio:
  admin-password: "${ADMIN_PASSWORD}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"
