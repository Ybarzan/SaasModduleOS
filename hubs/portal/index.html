<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Applique le thème stocké avant le premier rendu, pour éviter un flash du mauvais thème -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('praxio-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#14100c" />
    <meta name="description" content="Praxio — portail d'accès à l'écosystème : conformité douanière, flotte, marketplace de capacité et logistique." />
    <title>Praxio — Portail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
