# ===========================================================
# IncoKalk - Stack de développement LOCAL
# Lance uniquement Postgres + Redis + MinIO + pgAdmin
# Le backend Spring Boot et le frontend tournent dans l'IDE.
# ===========================================================
# Usage :
#   docker compose -f infrastructure/docker/docker-compose.dev.yml --env-file infrastructure/docker/.env up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev   (dans un autre terminal)
# ===========================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incokalk-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incokalk}
      POSTGRES_USER: ${POSTGRES_USER:-incokalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c max_connections=100
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incokalk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: incokalk-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: incokalk-minio-dev
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crée les buckets une seule fois au démarrage
  minio-init:
    image: minio/mc:latest
    container_name: incokalk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/incokalk-documents;
        mc mb --ignore-existing local/incokalk-logos;
        mc anonymous set none local/incokalk-documents;
        mc anonymous set none local/incokalk-logos;
        echo 'MinIO buckets created successfully';
      "
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: incokalk-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@incokalk.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  # Publié sur l'hôte (contrairement au compose principal) : le backend tourne
  # dans l'IDE en mode dev, hors du réseau Docker interne.
  embeddings:
    image: praxio-embeddings-dev
    build:
      context: ../../embeddings-service
      dockerfile: Dockerfile
    container_name: incokalk-embeddings-dev
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata_dev:
  redisdata_dev:
  miniodata_dev: