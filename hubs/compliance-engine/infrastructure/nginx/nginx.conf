limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# HTTP :80 — sondes de santé + redirection vers HTTPS pour tout le reste.
server {
    listen 80;
    server_name localhost;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — certificat monté depuis ./ssl (auto-signé en local ; en
# production, remplacer fullchain.pem/privkey.pem par un vrai certificat,
# ou terminer le TLS en amont chez un edge managé et retirer ce bloc).
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # add_header n'hérite pas du bloc server dès qu'un location définit le
    # sien — HSTS redéclaré explicitement ici, pas un oubli.
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Spring Boot
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
    }
}
