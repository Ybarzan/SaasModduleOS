global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fleethub-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8090"]
        labels:
          app: fleethub
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
