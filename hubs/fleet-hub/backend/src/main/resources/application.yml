server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

spring:
  application:
    name: fleet-hub-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:fleethub;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: "${JWT_SECRET:dev-only-change-me-in-prod-2026!secret-key-32chars!!}"
    expiration-ms: 86400000
  base-url: "${APP_BASE_URL:http://localhost:5199}"
  integration:
    secret-key: "${INTEGRATION_SECRET_KEY:dev-only-integration-secret-change-me}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:*}"
  registration:
    trial-days: "${APP_REGISTRATION_TRIAL_DAYS:14}"
  trial:
    grace-days: "${APP_TRIAL_GRACE_DAYS:7}"
  security:
    admin-password: "${ADMIN_PASSWORD:admin}"
    gest-password: "${GESTIONNAIRE_PASSWORD:gestion}"
    admin-allowed-ips: "${APP_ADMIN_ALLOWED_IPS:}"
    rate-limit:
      enabled: false
      window-seconds: 60
      default-limit: "${APP_RATE_LIMIT_DEFAULT:60}"
    login:
      rate-limit: 0
      window-seconds: 60
  seed:
    enabled: "${APP_SEED_ENABLED:true}"
  mail:
    enabled: "${MAIL_ENABLED:false}"
    host: "${MAIL_HOST:smtp.example.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    from: "${MAIL_FROM:no-reply@fleethub.fr}"
    base-url: "${APP_BASE_URL:http://localhost:5199}"
  alert:
    evaluation-minutes: 15

stripe:
  enabled: "${STRIPE_ENABLED:false}"
  secret-key: "${STRIPE_SECRET_KEY:}"
  webhook-secret: "${STRIPE_WEBHOOK_SECRET:}"
  price-starter: "${STRIPE_PRICE_STARTER:}"
  price-pro: "${STRIPE_PRICE_PRO:}"
  price-enterprise: "${STRIPE_PRICE_ENTERPRISE:}"
  success-url: "${STRIPE_SUCCESS_URL:http://localhost:5199/billing}"
  cancel-url: "${STRIPE_CANCEL_URL:http://localhost:5199/billing}"
  portal-return-url: "${STRIPE_PORTAL_RETURN_URL:http://localhost:5199/billing}"

sentry:
  # DSN Sentry. Vide = SDK désactivé (aucun envoi, aucun log applicatif modifié).
  dsn: "${SENTRY_DSN:}"
  environment: "${APP_ENV:dev}"
  traces-sample-rate: 0.2
  send-default-pii: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

integration:
  webhook-api-key: "${INTEGRATION_WEBHOOK_API_KEY:}"
  tacho:
    enabled: false
    provider: ""                 # tachogram | as24-files | webfleet
    base-url: ""
    api-key: ""
    sync-days-back: 7
  gps:
    enabled: false
    provider: ""                 # webfleet | wialon | geotab | balise-gps
    base-url: ""
    api-key: ""
  cost:
    enabled: false
    provider: ""                 # as24-infoservice | csv-import
    base-url: ""
    api-key: ""
    sync-days-back: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fleethub: "${APP_LOG_LEVEL:INFO}"

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleethub}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:fleethub}
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Permet une mise à niveau en douceur d'un déploiement existant dont le schéma a été
    # créé par Hibernate (ddl-auto: update, avant l'introduction de Flyway) : si les tables
    # existent déjà, elles sont considérées conformes à V1 plutôt que rejouées.
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 300000
      use-key-prefix: true
      key-prefix: "fleethub:"
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: "${JWT_SECRET}"
  base-url: "${APP_BASE_URL:https://localhost}"
  integration:
    secret-key: "${INTEGRATION_SECRET_KEY}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"
  registration:
    trial-days: "${APP_REGISTRATION_TRIAL_DAYS:14}"
  trial:
    grace-days: "${APP_TRIAL_GRACE_DAYS:7}"
  security:
    admin-password: "${ADMIN_PASSWORD}"
    gest-password: "${GESTIONNAIRE_PASSWORD}"
    admin-allowed-ips: "${APP_ADMIN_ALLOWED_IPS:}"
    rate-limit:
      enabled: "${APP_RATE_LIMIT_ENABLED:true}"
      window-seconds: 60
      default-limit: "${APP_RATE_LIMIT_DEFAULT:60}"
    login:
      rate-limit: ${APP_LOGIN_RATE_LIMIT:10}
      window-seconds: 60
  seed:
    enabled: "${APP_SEED_ENABLED:false}"
  mail:
    enabled: "${MAIL_ENABLED:false}"
    host: "${MAIL_HOST:smtp.example.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    from: "${MAIL_FROM:no-reply@fleethub.fr}"
    base-url: "${APP_BASE_URL:http://localhost:5199}"
  alert:
    evaluation-minutes: 15
